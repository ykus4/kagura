name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os-label }}, LLVM ${{ matrix.llvm }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS (Apple Silicon) ─────────────────────────────────────────
          - runner: macos-14
            os-label: macos-arm64
            llvm: "21"

          - runner: macos-14
            os-label: macos-arm64
            llvm: "22"

          # ── Linux (x86_64) ────────────────────────────────────────────────
          - runner: ubuntu-22.04
            os-label: linux-x86_64
            llvm: "19"

          - runner: ubuntu-22.04
            os-label: linux-x86_64
            llvm: "21"

          - runner: ubuntu-22.04
            os-label: linux-x86_64
            llvm: "22"

    steps:
      - uses: actions/checkout@v4

      # ── macOS: install via Homebrew ────────────────────────────────────────
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@${{ matrix.llvm }} || true
          brew link --force --overwrite llvm@${{ matrix.llvm }} || true
          echo "LLVM_PREFIX=$(brew --prefix llvm@${{ matrix.llvm }})" >> $GITHUB_ENV

      # ── Linux: install via apt ─────────────────────────────────────────────
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ matrix.llvm }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            llvm-${{ matrix.llvm }}-dev \
            clang-${{ matrix.llvm }} \
            libclang-${{ matrix.llvm }}-dev
          echo "LLVM_PREFIX=/usr/lib/llvm-${{ matrix.llvm }}" >> $GITHUB_ENV

      # ── Set compiler paths (macOS: clang, Linux: clang-NN) ───────────────
      - name: Set compiler env (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "KAGURA_CC=${LLVM_PREFIX}/bin/clang"   >> $GITHUB_ENV
          echo "KAGURA_CXX=${LLVM_PREFIX}/bin/clang++" >> $GITHUB_ENV

      - name: Set compiler env (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "KAGURA_CC=$(command -v clang-${{ matrix.llvm }})"   >> $GITHUB_ENV
          echo "KAGURA_CXX=$(command -v clang++-${{ matrix.llvm }})" >> $GITHUB_ENV

      # ── Configure ─────────────────────────────────────────────────────────
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${LLVM_PREFIX}" \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER="${KAGURA_CC}" \
            -DCMAKE_CXX_COMPILER="${KAGURA_CXX}" \
            -DKAGURA_BUILD_TESTS=OFF \
            -DKAGURA_BITCODE_TOOLS=OFF

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake --build build -- -j$(sysctl -n hw.logicalcpu)
          else
            cmake --build build -- -j$(nproc)
          fi

      # ── Stage artefacts ────────────────────────────────────────────────────
      #
      # Bundle layout per platform+llvm:
      #   kagura-<version>-<os-label>-llvm<llvm>.tar.gz
      #     ├── lib/            KaguraObfuscator.{dylib,so}, libkagura_runtime.a
      #     ├── include/kagura/ game_protect.h, VM.h + VMOpcodes.def
      #                         (the pass-plugin headers need LLVM and are not
      #                          part of the consumer interface)
      #     ├── bin/            kagura-opt (when built)
      #     └── share/kagura/   profiles/*.json
      #
      # This used to hand-copy build-tree paths, which required the
      # plugin-ext / runtime-prefix / runtime-ext matrix entries purely to
      # spell the filenames per platform, and silently shipped nothing when a
      # path moved. The project now has install() rules, so CMake decides the
      # layout and naming.
      - name: Stage artefacts
        id: stage
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          BUNDLE="kagura-${VERSION}-${{ matrix.os-label }}-llvm${{ matrix.llvm }}"

          cmake --install build --prefix "${BUNDLE}"

          # Fail loudly rather than shipping an empty archive.
          test -n "$(find "${BUNDLE}" -name 'KaguraObfuscator.*' -print -quit)" \
            || { echo "::error::plugin missing from install tree"; exit 1; }
          test -f "${BUNDLE}/lib/libkagura_runtime.a" \
            || { echo "::error::runtime missing from install tree"; exit 1; }

          tar -czf "${BUNDLE}.tar.gz" "${BUNDLE}"
          echo "bundle=${BUNDLE}.tar.gz" >> $GITHUB_OUTPUT
          echo "bundle_name=${BUNDLE}.tar.gz" >> $GITHUB_OUTPUT

      # ── Upload to GitHub Release ───────────────────────────────────────────
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || github.event.inputs.tag }}" \
            "${{ steps.stage.outputs.bundle }}" \
            --clobber

  # ── Source tarball (once, not per-matrix) ─────────────────────────────────
  source-tarball:
    name: Source tarball
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        id: src
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          NAME="kagura-${VERSION}-source.tar.gz"
          git archive --format=tar.gz --prefix="kagura-${VERSION}/" HEAD -o "${NAME}"
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Upload source archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || github.event.inputs.tag }}" \
            "${{ steps.src.outputs.name }}" \
            --clobber
